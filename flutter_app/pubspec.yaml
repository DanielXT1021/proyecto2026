name: vivero_ia
description: Sistema inteligente de monitoreo de plantas para viveros.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Red
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Imágenes
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # Navegación
  go_router: ^14.2.7

  # UI
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  intl: ^0.19.0

  # Permisos y almacenamiento
  permission_handler: ^11.3.1
  path_provider: ^2.1.3

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
